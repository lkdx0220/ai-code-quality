name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: ruff check
        run: ruff check src tests
      - name: ruff format
        run: ruff format --check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install mypy
      - name: mypy
        run: python -m mypy src

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: windows-latest, python-version: "3.13"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest pytest-cov
      - name: pytest
        run: python -m pytest tests -q --cov=ai_code_quality --cov-report=term

  # 红线回归（需求单第四节 1/2）：未配置 .specdrift.toml 的仓库行为与旧版一致。
  # 本仓库自身就是"无配置仓库"——spec-drift 相关命令必须完全旁路，scan 口径不变。
  specdrift-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: 无配置仓库上 spec-gate 旁路
        run: |
          test ! -f .specdrift.toml
          OUT=$(cq spec-gate --mode=hard); RC=$?
          echo "$OUT"
          [ $RC -eq 0 ] && echo "$OUT" | grep -q "未启用"
      - name: scan 的 adapter 集不含 spec 项
        run: |
          cq scan --project . --no-deepsec --adapters ruff-check > /dev/null
          python - <<'EOF'
          import json
          from pathlib import Path
          run = sorted(Path("audits").glob("*-full"))[-1]
          summary = json.loads((run / "summary.json").read_text(encoding="utf-8"))
          names = [t["name"] for t in summary["tools"]]
          assert "spec-gate" not in names and "specdrift" not in names, names
          assert not any("spec" in str(t.get("reason", "")).lower() for t in summary["tools"])
          print("compat OK：scan 口径未被 spec-drift 污染，工具集 =", names)
          EOF

  # 自举（dogfood）：cq 扫 cq 自己，守住我们给自己立的规矩——
  # 工具不许 error/timeout，活跃 findings 不许有 blocker/high。
  # deepsec 在 CI 里跳过（外部依赖），覆盖率中等的债务如实存在，不进本断言。
  # 双平台跑：路径/根目录处理是平台差异重灾区（两次真实回归都栽在这）。
  dogfood:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e . ruff mypy radon vulture pytest pytest-cov
      - name: 先跑一遍测试套件（复现"本地逐条复现 CI"的使用路径，留下 tmp 会话目录）
        run: python -m pytest tests -q
      - name: cq scan（自扫）
        run: cq scan --project . --no-deepsec --adapters ruff-check,ruff-format,mypy,radon,vulture,pytest
      - name: 自举断言
        shell: bash
        env:
          PYTHONIOENCODING: utf-8  # Windows cp1252 控制台打印中文会 UnicodeEncodeError
        run: |
          RUN=$(ls -t audits | grep -v baselines | head -1)
          echo "run: $RUN"
          python - "$RUN" <<'EOF'
          import json, sys
          from pathlib import Path

          run = Path("audits") / sys.argv[1]
          summary = json.loads((run / "summary.json").read_text(encoding="utf-8"))
          findings = json.loads((run / "findings.json").read_text(encoding="utf-8"))["findings"]

          bad_tools = [
              f"{t['name']}:{t['status']}"
              for t in summary["tools"]
              if t["status"] in ("error", "timeout")
          ]
          assert not bad_tools, f"工具执行不完整: {bad_tools}"

          active_bh = [
              f"{f['source']}:{f['rule']}@{f['file']}:{f['line']}"
              for f in findings
              if f.get("status") != "suppressed" and f.get("severity") in ("blocker", "high")
          ]
          assert not active_bh, f"存在活跃 blocker/high: {active_bh}"
          suppressed = [f for f in findings if f.get("status") == "suppressed"]
          print(f"dogfood OK：工具全部正常完成，活跃 blocker/high = 0（豁免 {len(suppressed)} 条，理由见 .cq/suppressions.json）")
          EOF
