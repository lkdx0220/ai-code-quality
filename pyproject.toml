[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-code-quality"
version = "0.3.0"
description = "cq - 通用本地代码质量扫描 CLI：统一聚合 ruff/mypy/radon/vulture/pytest/import-linter/deepsec 的 findings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "cq" }]
keywords = ["code-quality", "lint", "security", "sonar", "ai-slop"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []  # 刻意为空：核心 CLI 只用标准库；外部工具由 subprocess 调用

[project.scripts]
cq = "ai_code_quality.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_code_quality"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
norecursedirs = ["fixtures"]  # fixture 仓库有自己的（故意失败的）测试，不属本包

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]  # fixture 是埋雷演示仓库，不算本包代码

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = "tests/fixtures"

[tool.vulture]
min_confidence = 60
# 豁免清单（理由必写，定期复审）：
# - description: Adapter 子类的元数据，经 safe_run 注入 AdapterResult，在报告工具状态表展示
# - SOURCES: 统一 schema 的 source 枚举契约（Finding 校验用），Phase 2 sonar/slop 扩展
# - confidence: Finding 字段，经 asdict 序列化进 findings.json，vulture 看不到读取路径
ignore_names = ["description", "SOURCES", "confidence"]
